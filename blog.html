<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ブログ | ふるびや</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Old+Mincho:wght@500;700;900&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --denim:#2d4a73;
  --denim-deep:#1f3555;
  --wash:#e9eef4;
  --paper:#f7f9fb;
  --orange:#e8761e;
  --orange-deep:#a84b0c;
  --ink:#1c2635;
  --serif:"Zen Old Mincho","Hiragino Mincho ProN","Yu Mincho",serif;
  --sans:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);line-height:1.9;font-size:16px}
a{color:inherit}
a:focus-visible{outline:3px solid var(--orange);outline-offset:3px}
.wrap{max-width:960px;margin:0 auto;padding:0 20px}

header{background:var(--denim);color:#fff;border-bottom:4px solid var(--denim-deep);position:relative}
header::after{content:"";position:absolute;left:0;right:0;bottom:-11px;border-top:2px dashed var(--orange)}
.bar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 24px;padding:14px 20px;max-width:960px;margin:0 auto}
.logo{font-family:var(--serif);font-weight:900;font-size:1.6rem;letter-spacing:.12em;text-decoration:none}
nav ul{display:flex;gap:4px 22px;list-style:none;margin:0;padding:0;flex-wrap:wrap}
nav a{text-decoration:none;padding:4px 2px;border-bottom:2px solid transparent}
nav a:hover,nav a[aria-current="page"]{border-bottom-color:var(--orange)}

.title{padding:64px 0 24px}
h1{font-family:var(--serif);font-weight:900;font-size:clamp(1.9rem,5vw,2.8rem);line-height:1.4;margin:0 0 10px;color:var(--denim-deep)}
.title p{margin:0;color:#43506a}

/* タイムライン（日付と日記だけ） */
.timeline{max-width:640px;margin:16px auto 48px;padding:0 20px;list-style:none}
.timeline li{background:#fff;border:2px solid var(--denim);padding:18px 22px;margin:0 0 -2px}
.timeline li:nth-child(even){border-color:var(--denim)}
.timeline li:first-child{border-top:4px solid var(--orange)}
.timeline time{display:block;font-family:var(--serif);font-weight:700;color:var(--orange-deep);font-size:.95rem;margin-bottom:4px}
.timeline p{margin:0;white-space:pre-wrap}

footer{background:var(--denim-deep);color:#dbe5f1;padding:36px 0 28px;margin-top:24px;border-top:2px dashed var(--orange);text-align:center;font-size:.9rem}

@media (max-width:720px){
  .title{padding:44px 0 16px}
}
</style>
</head>
<body>

<header>
  <div class="bar">
    <a class="logo" href="index.html">ふるびや</a>
    <nav aria-label="メインメニュー">
      <ul>
        <li><a href="index.html">ホーム</a></li>
        <li><a href="blog.html" aria-current="page">ブログ</a></li>
        <li><a href="gallery.html">ギャラリー</a></li>
        <li><a href="about.html">このサイトについて</a></li>
      </ul>
    </nav>
  </div>
</header>

<main>
  <div class="wrap title">
    <h1>勉強のきろく</h1>
    <p>その日に勉強したことを、ひとことずつ残しています。</p>
  </div>

  <!-- 新しい投稿は、いちばん上にコピーして足してください -->
  <ol class="timeline">
    <li>
      <time datetime="2026-10-19">2026.10.19</time>
      <p>（ここに今日の日記を書く）</p>
    </li>
    <li>
      <time datetime="2026-10-18">2026.10.18</time>
      <p>（ここに日記を書く）</p>
    </li>
    <li>
      <time datetime="2026-10-17">2026.10.17</time>
      <p>（ここに日記を書く）</p>
    </li>
  </ol>
</main>

<footer>
  <div class="wrap">© ふるびや</div>
</footer>

</body>
</html>
